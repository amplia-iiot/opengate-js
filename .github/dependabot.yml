version: 2

# This file configures *version updates* only — the routine "bump X to Y" pull requests.
#
# Dependabot **security updates** are a separate feature, enabled in the repository settings, and
# they do not read this file. Removing the npm block below therefore costs no CVE coverage: security
# patches keep arriving as their own pull requests. That distinction is the whole point of this
# configuration, so check the settings before assuming a missing ecosystem means missing alerts.
#
# Why npm version updates are off: on 2026-09-01 the default branch moved from a frozen `master` to
# `develop` and Dependabot, which had been aimed at the frozen branch for years, opened eight pull
# requests in one minute. The backlog was real — 29 open alerts, six of them reaching consumers at
# runtime — but the weekly routine bumps on top of it are noise nobody reads, and unread pull
# requests are how the previous thirteen sat open for five years. Dependencies here move slowly and
# the library is small: a human bump when a release needs it beats a queue that trains everyone to
# ignore the label.
#
# GitHub Actions stays on, monthly and grouped into a single pull request: pinned action versions
# rot silently and go unnoticed until a workflow breaks, and one PR a month is not noise.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
